name: Release

# Pousser un tag vX.Y.Z construit Windows + macOS et publie la Release.
# Lancé à la main (workflow_dispatch) :
#   - sans tag : construit seulement les fichiers, sans publier ;
#   - avec un tag existant (ex. v1.2.0) : construit ce tag et publie, ou complète la Release
#     si elle existe déjà (par exemple créée depuis l'interface web de GitHub).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à publier (ex. v1.2.0). Vide : construire sans publier."
        required: false
        default: ""

permissions:
  contents: write

env:
  # Passés par l'environnement, jamais insérés tels quels dans les scripts
  TAG: ${{ inputs.tag || github.ref_name }}
  PUBLIER: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}

jobs:
  verifier:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Le tag correspond à la version du package.json
        if: env.PUBLIER == 'true'
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag invalide : $TAG (attendu : vX.Y.Z)"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Le tag est $TAG mais package.json indique $version"
            exit 1
          fi
      - run: npm run lint
      - run: npm test
      - name: Notes de version présentes dans le CHANGELOG
        run: npm run --silent release-notes > /dev/null

  construire:
    name: Construire (${{ matrix.name }})
    needs: verifier
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win portable nsis
          - name: macOS
            os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
      - name: Construire
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Le test de fumée lance Electron non empaqueté : il ne voit pas les problèmes propres
      # au paquet (noms des helpers, Info.plist, signature). On lance donc la vraie app.
      - name: L'app empaquetée démarre (macOS)
        if: runner.os == 'macOS'
        run: |
          app=$(find dist -maxdepth 2 -name "*.app" -type d | head -n 1)
          test -n "$app" || { echo "::error::Aucune .app dans dist"; exit 1; }
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          "$exe" --enable-logging &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            code=0; wait "$pid" || code=$?
            echo "::error::L'app empaquetée s'est arrêtée au démarrage (code $code)"
            exit 1
          fi
          kill "$pid"
      - uses: actions/upload-artifact@v7
        with:
          name: cahier-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  publier:
    name: Publier la Release
    needs: construire
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.js "$TAG" > notes.md
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          title="Cahier d'écriture ${TAG#v}"
          ls -la out
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Release déjà créée (interface web, ou relance) : on remplace fichiers et notes
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md $prerelease
          else
            gh release create "$TAG" out/* --title "$title" --notes-file notes.md --verify-tag $prerelease
          fi
