name: Release

# Pousser un tag vX.Y.Z construit Windows + macOS et publie la Release.
# Lancé à la main (workflow_dispatch), il construit seulement les fichiers, sans publier.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  verifier:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Le tag correspond à la version du package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag est $GITHUB_REF_NAME mais package.json indique $version"
            exit 1
          fi
      - run: npm run lint
      - run: npm test
      - name: Notes de version présentes dans le CHANGELOG
        run: npm run --silent release-notes > /dev/null

  construire:
    name: Construire (${{ matrix.name }})
    needs: verifier
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win portable nsis
          - name: macOS
            os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
      - name: Construire
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Le test de fumée lance Electron non empaqueté : il ne voit pas les problèmes propres
      # au paquet (noms des helpers, Info.plist, signature). On lance donc la vraie app.
      - name: L'app empaquetée démarre (macOS)
        if: runner.os == 'macOS'
        run: |
          app=$(find dist -maxdepth 2 -name "*.app" -type d | head -n 1)
          test -n "$app" || { echo "::error::Aucune .app dans dist"; exit 1; }
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          "$exe" --enable-logging &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            code=0; wait "$pid" || code=$?
            echo "::error::L'app empaquetée s'est arrêtée au démarrage (code $code)"
            exit 1
          fi
          kill "$pid"
      - uses: actions/upload-artifact@v7
        with:
          name: cahier-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  publier:
    name: Publier la Release
    needs: construire
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.js "$GITHUB_REF_NAME" > notes.md
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          ls -la out
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Cahier d'écriture ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag $prerelease
